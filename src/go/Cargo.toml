[package]
name = "syncative-go"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "Syncative's combined Go archive: rclone librclone RPC + native ProtonDrive (go-proton-api) shims."
publish = false
build = "build.rs"

[lib]
name = "syncative_go"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
bindgen = "0.71"
