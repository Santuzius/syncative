# cargo-about settings for scripts/update-licenses.sh: the licenses Syncative accepts from its crates, and the targets it ships for.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "Unlicense", "0BSD", "CC0-1.0", "MPL-2.0", "LGPL-2.1-or-later", "GPL-3.0-or-later", "GPL-3.0", "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0", "bzip2-1.0.6", "LicenseRef-UFL-1.0", "CC-BY-4.0", "Pixar", "OpenSSL"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

workarounds = ["ring"]
