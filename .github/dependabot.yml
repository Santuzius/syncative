# Weekly dependency updates as pull requests into develop (doc/development/dependencies.md). .github/workflows/check.yml tests each one and merges it if every update in it is a patch, or a minor step of a 1.x or later version; everything else waits for review. GitHub reads this file from main.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ":arrow_up:"
    # The forks share one tag and move together, by hand (doc/packaging/release.md#the-android-forks).
    ignore:
      - dependency-name: iced
      - dependency-name: iced_widget
      - dependency-name: iced_android
      - dependency-name: android-activity
    groups:
      cargo-patch:
        update-types: [patch]
      cargo-minor:
        update-types: [minor]

  - package-ecosystem: gomod
    directory: /src/go
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ":arrow_up:"
    # The rclone fork and resty are pinned through `replace` in go.mod (doc/packaging/release.md#the-rclone-fork). Proton's modules come with go-proton-api, a submodule, and follow its versions; several are Proton's own `-proton` builds, which a newer upstream release would replace.
    ignore:
      - dependency-name: github.com/rclone/rclone
      - dependency-name: github.com/go-resty/resty/v2
      - dependency-name: github.com/ProtonMail/*
    groups:
      go-patch:
        update-types: [patch]
      go-minor:
        update-types: [minor]

  - package-ecosystem: nix
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ":arrow_up:"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ":arrow_up:"
    groups:
      actions:
        patterns: ["*"]
